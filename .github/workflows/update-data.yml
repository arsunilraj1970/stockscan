name: Update market data

on:
  schedule:
    # 22:30 UTC Mon-Fri = after US market close (4:00pm ET)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # allows manual Run workflow button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python pipeline/update_us_data.py
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add us_daily data
          git diff --cached --quiet || git commit -m "data update $(date -u +%F)"
          git push
